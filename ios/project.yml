name: Kstati
options:
  bundleIdPrefix: app.kstati
  deploymentTarget:
    iOS: "17.0"
packages:
  KstatiModules:
    path: .
settings:
  base:
    SWIFT_VERSION: 6.0
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: 1.0
    CURRENT_PROJECT_VERSION: 1
schemes:
  Kstati:
    build:
      targets:
        Kstati: all
        ShareFixtureHost: all
    test:
      targets:
        - KstatiUITests
targets:
  Kstati:
    type: application
    platform: iOS
    sources: [KstatiApp/Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.kstati.ios
        INFOPLIST_KEY_CFBundleDisplayName: Кстати
        CODE_SIGN_ENTITLEMENTS: KstatiApp/Kstati.entitlements
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    dependencies:
      - package: KstatiModules
        product: MemoryCore
      - package: KstatiModules
        product: MemoryPersistence
      - package: KstatiModules
        product: MemoryOCR
      - target: KstatiShareExtension
        embed: true
  KstatiShareExtension:
    type: app-extension
    platform: iOS
    sources: [KstatiShareExtension/Sources]
    info:
      path: KstatiShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Кстати
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.kstati.ios.share
        CODE_SIGN_ENTITLEMENTS: KstatiShareExtension/Share.entitlements
    dependencies:
      - package: KstatiModules
        product: MemoryCore
      - package: KstatiModules
        product: MemoryPersistence
  KstatiUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [KstatiApp/Tests/UITests]
    dependencies:
      - target: Kstati
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.kstati.ios.uitests
  ShareFixtureHost:
    type: application
    platform: iOS
    sources:
      - KstatiApp/Tests/FixtureHost
      - path: KstatiApp/Tests/Fixtures/appointment.png
        type: file
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.kstati.sharefixture
        INFOPLIST_KEY_CFBundleDisplayName: Fixture Share
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
