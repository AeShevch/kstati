name: Kstati
options:
  bundleIdPrefix: app.kstati
  deploymentTarget:
    iOS: "17.0"
packages:
  KstatiModules:
    path: .
settings:
  base:
    SWIFT_VERSION: 6.0
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
schemes:
  Kstati:
    build:
      targets:
        Kstati: all
    test:
      targets:
        - KstatiUITests
targets:
  Kstati:
    type: application
    platform: iOS
    sources: [KstatiApp]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.kstati.ios
        INFOPLIST_KEY_CFBundleDisplayName: Кстати
        CODE_SIGN_ENTITLEMENTS: KstatiApp/Kstati.entitlements
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    dependencies:
      - package: KstatiModules
        product: MemoryCore
      - package: KstatiModules
        product: MemoryPersistence
      - package: KstatiModules
        product: MemoryOCR
      - target: KstatiShareExtension
        embed: true
  KstatiShareExtension:
    type: app-extension
    platform: iOS
    sources: [KstatiShareExtension]
    info:
      path: KstatiShareExtension/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.kstati.ios.share
        CODE_SIGN_ENTITLEMENTS: KstatiShareExtension/Share.entitlements
    dependencies:
      - package: KstatiModules
        product: MemoryCore
      - package: KstatiModules
        product: MemoryPersistence
  KstatiUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests/UITests]
    dependencies:
      - target: Kstati
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.kstati.ios.uitests
